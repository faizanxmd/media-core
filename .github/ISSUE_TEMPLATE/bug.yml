name: Bug
description: Something doesn't work as it should
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: "1. ...\n2. ..."
  - type: input
    id: version
    attributes:
      label: Versions
      description: "`media-core-engine version`, and the app's version from its settings if it's an app problem"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `media-core-engine doctor --json`
      description: Check it for anything you'd rather not share (names, paths) before posting.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl --user -u media-core-engine -n 100`, around the time it happened"
      render: text
