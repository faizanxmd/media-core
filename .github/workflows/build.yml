# Builds the signed apps. Two ways in:
# - release.yml calls it on a version tag; the APKs go into that release.
# - By hand (workflow_dispatch), for the maintainer's own testing: scripts/ci-build.sh starts it, waits, and
#   puts the APKs on the maintainer's server. "check" builds nothing: it proves the signing key and Gradle work.
# The signing key lives in the "release" environment, which only v* tags and main may use and which waits for
# the owner's approval, so a pull request or another branch never reaches it.
name: Build apps

on:
  workflow_call:
    inputs:
      what:
        type: string
        default: both
  workflow_dispatch:
    inputs:
      what:
        description: Which apps to build
        type: choice
        options: [both, tv, phone, check]
        default: both

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    env:
      WHAT: ${{ inputs.what }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs the tags

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.MEDIA_CORE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.MEDIA_CORE_KS_PASS }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "no signing key: set MEDIA_CORE_KEYSTORE_B64 and MEDIA_CORE_KS_PASS in the release environment"; exit 1; }
          umask 077
          mkdir -p ~/.config/media-core
          printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.config/media-core/app.jks
          printf '%s' "$KS_PASS" > ~/.config/media-core/app.jks.pass

      - name: Check the Gradle setup
        if: inputs.what == 'check'
        working-directory: android
        run: ./gradlew --no-daemon -q :core:help :app:help :phone:help

      - name: Version
        if: inputs.what != 'check'
        run: |
          # on a release tag vX.Y.Z: name X.Y.Z, code X*10000000+Y*100000+Z*1000 (android/build.sh does the rest)
          case "$GITHUB_REF" in
            refs/tags/v*)
              v=${GITHUB_REF_NAME#v}; base=${v%%-*}
              IFS=. read -r X Y Z <<< "$base"
              echo "VCODE=$(( X*10000000 + Y*100000 + Z*1000 ))" >> "$GITHUB_ENV"
              echo "VNAME=$v" >> "$GITHUB_ENV" ;;
          esac

      - name: Build
        if: inputs.what != 'check'
        env:
          MEDIA_CORE_APK_DIR: ${{ runner.temp }}/apks
        run: |
          if [ "$WHAT" != phone ]; then android/build.sh; fi
          if [ "$WHAT" != tv ]; then android/build.sh --phone; fi
          for a in "$ANDROID_HOME"/build-tools/*/apksigner; do apksigner=$a; done # the newest build-tools
          for f in "$MEDIA_CORE_APK_DIR"/*.apk; do echo "$f"; "$apksigner" verify --print-certs "$f"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.what != 'check'
        with:
          name: apks
          path: ${{ runner.temp }}/apks
          retention-days: 14
          if-no-files-found: error
