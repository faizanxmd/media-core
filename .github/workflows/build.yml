# Builds the apps on GitHub's computers, only when started by hand.
# scripts/ci-build.sh starts this, waits, and publishes the APKs where the engine serves them.
# "check" builds nothing: it proves the signing key and Gradle setup work.
name: Build apps

on:
  workflow_dispatch:
    inputs:
      what:
        description: Which apps to build
        type: choice
        options: [both, tv, phone, check]
        default: both

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: ${{ vars.MEDIA_CORE_TZ || 'UTC' }} # the version name is local time (set the repo variable MEDIA_CORE_TZ)
      WHAT: ${{ inputs.what }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.MEDIA_CORE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.MEDIA_CORE_KS_PASS }}
        run: |
          umask 077
          mkdir -p ~/.config/media-core
          printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.config/media-core/app.jks
          printf '%s' "$KS_PASS" > ~/.config/media-core/app.jks.pass
          keytool -list -keystore ~/.config/media-core/app.jks -storepass "$KS_PASS" | grep 'SHA-256'

      - name: Check the Gradle setup
        if: inputs.what == 'check'
        working-directory: android
        run: ./gradlew --no-daemon -q :core:help :app:help :phone:help

      - name: Build
        if: inputs.what != 'check'
        env:
          MEDIA_CORE_APK_DIR: ${{ runner.temp }}/apks
        run: |
          if [ "$WHAT" != phone ]; then android/build.sh; fi
          if [ "$WHAT" != tv ]; then android/build.sh --phone; fi

      - uses: actions/upload-artifact@v4
        if: inputs.what != 'check'
        with:
          name: apks
          path: ${{ runner.temp }}/apks
          retention-days: 14
          if-no-files-found: error
