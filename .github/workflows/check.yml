# Runs on every push and pull request: engine tests, a compile of both apps (debug, unsigned, nothing
# published), and a scan for secrets and private details (the same check as the pre-commit hook).
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: engine/go.mod
      - name: Vet and test
        working-directory: engine
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          GOOS=darwin go vet ./...
          GOARCH=arm go vet ./...
          GOOS=darwin GOARCH=arm64 go build -o /dev/null .
          go test -count=1 -race ./...

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: engine/go.mod
      - name: Workflows (actionlint)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: install.sh under dash and busybox sh
        run: |
          sudo apt-get install -y -qq dash busybox >/dev/null
          dash -n install.sh
          busybox sh -n install.sh

  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Compile (no signing, nothing published)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :core:compileDebugKotlin :app:compileDebugKotlin :phone:compileDebugKotlin

  private:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Private details
        env:
          # one string per line; set it under Settings > Secrets > Actions
          DENYLIST: ${{ secrets.MEDIA_CORE_DENYLIST }}
        run: |
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist"
          MEDIA_CORE_DENYLIST="$RUNNER_TEMP/denylist" scripts/check-private.sh --all
      - name: Secrets (gitleaks)
        run: |
          v=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: engine/go.mod
      - name: shellcheck
        run: shellcheck -s sh install.sh deploy/install.sh scripts/test-install.sh
      - name: Build
        working-directory: engine
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=0.0.0-test" -o ../media-core-engine-test .
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=0.0.1-test" -o ../media-core-engine-test2 .
      - name: Install on Debian, Fedora and Arch
        run: |
          set -e
          run() { docker run --rm -v "$PWD:/src:ro" "$1" sh -c "$2 && useradd -m t && su t -c 'sh /src/scripts/test-install.sh /src/media-core-engine-test /src/media-core-engine-test2'"; }
          run debian:12 "apt-get update -qq && apt-get install -y -qq curl python3 aria2 ffmpeg >/dev/null"
          run fedora:41 "dnf install -y -q curl python3 aria2 ffmpeg-free procps-ng util-linux shadow-utils >/dev/null"
          run archlinux:latest "pacman -Sy --noconfirm --quiet curl python aria2 ffmpeg >/dev/null"
