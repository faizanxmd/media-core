<!doctype html>
<html><head><meta charset="utf-8"><title>Media Core: how it works</title>
<style>
.viz-root{color-scheme:light;--surface-1:#fcfcfb;--surface-2:var(--card,#f2f1ee);--line:var(--border,#dddcd6);--text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#7a7972;--series-1:#2a78d6;--series-2:#eb6834}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .viz-root{color-scheme:dark;--surface-1:#1a1a19;--surface-2:var(--card,#242422);--line:var(--border,#3a3a37);--text-primary:#f0efec;--text-secondary:#c3c2b7;--text-muted:#8f8e86;--series-1:#3987e5;--series-2:#d95926}}
body{margin:0}
.viz-root{color:var(--text-primary);font:14px/1.45 var(--font-sans,system-ui),sans-serif}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:28px 0 10px}
p.sub{color:var(--text-secondary);margin:0 0 8px}
svg text{fill:var(--text-primary);font:12px system-ui,sans-serif}
.box{fill:var(--surface-2);stroke:var(--line);stroke-width:1}
.hot{stroke:var(--series-1);stroke-width:1.5}
.arrow{stroke:var(--text-muted);stroke-width:1.5;fill:none;marker-end:url(#a)}
.warn{stroke:var(--series-2);stroke-width:2;fill:none;stroke-dasharray:5 4}
.small{fill:var(--text-secondary)!important;font-size:11px!important}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 24px}
.panel h3{font-size:13px;margin:0 0 6px;font-weight:600}
.legend{display:flex;gap:18px;color:var(--text-secondary);font-size:12px;margin-bottom:10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;display:none;color:var(--text-primary)}
table{border-collapse:collapse;font-size:12px;margin-top:14px}td,th{padding:3px 10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--text-secondary);font-weight:500}
</style></head>
<body><div class="viz-root">

<p class="sub">One laptop (mint) does everything. Blue = the path a film takes when you press Play. Dashed orange = the 100 Mb/s cable, the current bottleneck.</p>
<svg viewBox="0 0 890 320" width="100%" height="262" role="img" aria-label="Architecture diagram">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="currentColor" style="fill:var(--text-muted)"/></marker></defs>
<rect class="box" x="10" y="20" width="150" height="54" rx="8"/><text x="22" y="42">Download link</text><text class="small" x="22" y="60">from your phone / Mac</text>
<rect class="box" x="10" y="120" width="150" height="54" rx="8"/><text x="22" y="142">TMDB (internet)</text><text class="small" x="22" y="160">posters, titles, cast</text>
<rect class="box" x="210" y="10" width="300" height="170" rx="10"/><text x="222" y="30" style="font-weight:600">media-core-engine (Go, one 15 MB process)</text>
<rect class="box" x="222" y="42" width="130" height="40" rx="6"/><text x="232" y="60">engine + aria2</text><text class="small" x="232" y="74">download, unpack, DV fix</text>
<rect class="box" x="366" y="42" width="132" height="40" rx="6"/><text x="376" y="60">catalog</text><text class="small" x="376" y="74">folder scan, ffprobe</text>
<rect class="box" x="222" y="92" width="130" height="40" rx="6"/><text x="232" y="110">TMDB cache</text><text class="small" x="232" y="124">matches + images</text>
<rect class="box" x="366" y="92" width="132" height="40" rx="6"/><text x="376" y="110">watch + intros</text><text class="small" x="376" y="124">resume points, Skip Intro</text>
<rect class="box hot" x="222" y="140" width="276" height="32" rx="6"/><text x="232" y="160">player API :8790  (/home, /item, /stream, /img)</text>
<rect class="box" x="210" y="230" width="300" height="60" rx="10"/><text x="222" y="252">HDD  /srv/data/media</text><text class="small" x="222" y="270">Movies/Title (Year)/…  TV Shows/Show/Season 01/…</text>
<rect class="box" x="580" y="20" width="140" height="40" rx="8"/><text x="592" y="44">Deco router</text>
<rect class="box hot" x="580" y="120" width="300" height="110" rx="10"/><text x="592" y="142" style="font-weight:600">Media Core app on the TV</text><text class="small" x="592" y="162">Compose UI: home rows, detail page</text><text class="small" x="592" y="180">ExoPlayer (Media3): reads the file by byte ranges</text><text class="small" x="592" y="198">TV chip decodes HEVC / Dolby Vision</text><text class="small" x="592" y="216">FFmpeg decodes DTS / TrueHD audio</text>
<rect class="box" x="580" y="260" width="300" height="48" rx="8"/><text x="592" y="280">Plex (still running)</text><text class="small" x="592" y="296">separate server, separate app</text>
<path class="arrow" d="M160,47 H222"/><path class="arrow" d="M160,147 H210 V112 H222"/>
<path class="arrow" d="M287,82 V200 H300 V230"/><path class="arrow" d="M400,230 V172"/>
<path class="warn" d="M510,156 H545 V40 H580"/><text class="small" x="516" y="100">cable</text><text class="small" x="516" y="114">100 Mb/s</text>
<path class="arrow" d="M650,60 V120"/><text class="small" x="658" y="96">5 GHz Wi-Fi, 866 Mb/s</text>
<path class="arrow" d="M510,270 H580"/>
</svg>

<h2>Measured: Plex vs Media Core (same server, same TV)</h2>
<div class="legend"><span><i class="sw" style="background:var(--series-2)"></i>Plex</span><span><i class="sw" style="background:var(--series-1)"></i>Media Core</span></div>
<div class="grid" id="charts"></div>
<table><thead><tr><th>Step</th><th>Plex</th><th>Media Core</th><th>Faster by</th><th>Source</th></tr></thead><tbody id="tbl"></tbody></table>
<div id="tip"></div>
</div>
<script>
const data=[
 {k:"Press Play → picture (4K Oldboy)",u:"s",plex:10.0,mint:1.0,src:"Plex log 12:18:44→~12:18:55; Media Core measured on TV earlier"},
 {k:"Open a title's page (server time)",u:"ms",plex:200,mint:0.8,src:"Plex log /library/metadata; curl /api/v1/item"},
 {k:"Home screen data (server time)",u:"ms",plex:81,mint:1.1,src:"Plex log, 4 hub calls; curl /api/v1/home"},
 {k:"First poster, never shown before",u:"ms",plex:310,mint:32,src:"curl photo/:/transcode vs /api/v1/img"},
];
const C=document.getElementById('charts'),T=document.getElementById('tbl'),tip=document.getElementById('tip');
const fmt=(v,u)=>(v<10&&u==='ms'?v.toFixed(1):v<10?v.toFixed(1):Math.round(v))+' '+u;
data.forEach(d=>{
 const max=d.plex,W=340,L=48,bw=W-L-70;
 const el=document.createElement('div');el.className='panel';
 el.innerHTML=`<h3>${d.k}</h3><svg width="${W}" height="62">`+
 [['Plex',d.plex,'--series-2',8],['Media Core',d.mint,'--series-1',34]].map(([n,v,c,y])=>{
  const w=Math.max(3,v/max*bw);
  return `<g data-t="${n}: ${fmt(v,d.u)}"><rect x="0" y="${y-4}" width="${W}" height="26" fill="transparent"/>
  <text x="0" y="${y+13}" class="small">${n}</text>
  <path d="M${L},${y} h${w-4} a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-${w-4}z" style="fill:var(${c})"/>
  <text x="${L+w+6}" y="${y+13}">${fmt(v,d.u)}</text></g>`}).join('')+`</svg>`;
 C.appendChild(el);
 T.insertAdjacentHTML('beforeend',`<tr><td>${d.k}</td><td>${fmt(d.plex,d.u)}</td><td>${fmt(d.mint,d.u)}</td><td>${Math.round(d.plex/d.mint)}×</td><td>${d.src}</td></tr>`);
});
C.addEventListener('mousemove',e=>{const g=e.target.closest('g[data-t]');if(!g){tip.style.display='none';return}tip.textContent=g.dataset.t;tip.style.display='block';tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px'});
C.addEventListener('mouseleave',()=>tip.style.display='none');
</script></body></html>
